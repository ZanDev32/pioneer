name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        if: runner.os == 'Linux'
        run: pip install platformio

      - name: Cache pip and PlatformIO
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pip-pio-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-pio-

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Full suite
        if: runner.os == 'Linux'
        run: npm test

      - name: Coverage floors
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm run test:coverage

      - name: Unit suite
        if: runner.os != 'Linux'
        run: npm run test:unit

  protocol:
    name: protocol (inspector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Inspector tools/list
        run: npx --yes @modelcontextprotocol/inspector@2.14.0 --cli node dist/server.js --method tools/list

      - name: Inspector tools/call
        run: npx --yes @modelcontextprotocol/inspector@2.14.0 --cli node dist/server.js --method tools/call --tool-name pio_task_list

  e2e:
    name: e2e (manual)
    if: github.event_name == 'workflow_dispatch' && vars.PIO_E2E_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install dependencies
        run: npm ci

      - name: Run e2e UAT
        run: PIO_E2E=1 npm run test:e2e
        env:
          PIO_E2E_PROJECT: ${{ vars.PIO_E2E_PROJECT }}

  publish:
    name: publish (npm provenance)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Full suite
        run: npm test

      - name: Check tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(npm pkg get version | tr -d '"')"

      - name: Derive dist-tag
        id: dist_tag
        run: |
          version="$(npm pkg get version | tr -d '"')"
          case "$version" in
            *-*)
              echo "flag=--tag next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "flag=" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish to npm
        run: npm publish --provenance --access public ${{ steps.dist_tag.outputs.flag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Keep `latest` off prereleases
        if: steps.dist_tag.outputs.prerelease == 'true'
        run: |
          name="$(npm pkg get name | tr -d '"')"
          latest="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
          case "$latest" in
            *-*)
              echo "latest points at prerelease $latest - removing the tag"
              if ! npm dist-tag rm "$name" latest; then
                echo "::warning::could not remove the 'latest' dist-tag - the NPM_TOKEN can publish but not manage dist-tags. Fix by hand: npm dist-tag rm $name latest"
              fi
              ;;
            *)
              echo "latest stays on ${latest:-<none>}"
              ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
